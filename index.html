<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happybirthdaytati26</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(244, 63, 94, 0.3); }
            50% { box-shadow: 0 0 50px rgba(244, 63, 94, 0.6); }
        }
        .glow-box {
            animation: glow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-950 via-pink-950 to-slate-950 text-white min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-pink-500 selection:text-white relative">

    <!-- Festive Background Decorative Elements -->
    <div class="absolute top-12 left-10 w-72 h-72 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-12 right-10 w-96 h-96 bg-rose-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header / Navbar -->
    <header class="w-full py-6 px-6 text-center relative z-10">
        <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-5 py-2.5 rounded-full border border-white/20 text-pink-300 text-sm font-semibold tracking-wider uppercase shadow-lg shadow-pink-950/50">
            <span>🎂✨ С Днем Рождения, Тати! ✨🎂</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 relative z-10">
        <div class="max-w-md w-full mx-auto">

            <!-- Card Container -->
            <div id="main-card" class="bg-white/10 backdrop-blur-2xl border border-white/20 p-8 rounded-3xl shadow-2xl glow-box text-center transition-all duration-500">
                
                <!-- Initial Form State -->
                <div id="promo-section" class="transition-all duration-300">
                    <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 via-rose-500 to-amber-400 rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-pink-500/30 mb-6 text-4xl animate-bounce">
                        🎁
                    </div>

                    <h1 class="text-3xl font-extrabold tracking-tight mb-3 text-transparent bg-clip-text bg-gradient-to-r from-white via-pink-200 to-pink-400">
                        С днем рождения заюш!
                    </h1>
                    
                    <p class="text-pink-100/80 text-sm mb-8 leading-relaxed">
                        Введи свой персональный праздничный промокод, чтобы получить роскошный подарок! 💖
                    </p>

                    <form id="promo-form" onsubmit="handlePromoSubmit(event)" class="space-y-4">
                        <div class="relative">
                            <input 
                                type="text" 
                                id="promo-input" 
                                placeholder="Введите промокод..." 
                                required
                                class="w-full bg-slate-900/90 border border-pink-500/30 rounded-2xl px-5 py-4 text-center text-base text-white placeholder-pink-300/40 focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-500/20 transition-all shadow-inner"
                            >
                        </div>

                        <button 
                            type="submit" 
                            class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 hover:from-pink-600 hover:to-amber-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-pink-500/40 hover:shadow-pink-500/60 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 text-base"
                        >
                            Открыть подарок ✨
                        </button>
                    </form>

                    <div id="error-msg" class="hidden mt-4 text-rose-300 text-xs bg-rose-950/60 border border-rose-500/40 py-3 px-4 rounded-xl font-medium shadow-sm">
                        Упс! Такого промокода не существует. Проверь правильность ввода, заюш! 💕
                    </div>
                </div>

                <!-- Success Win State (Hidden initially) -->
                <div id="success-section" class="hidden space-y-6">
                    <div class="inline-block animate-float w-full flex justify-center">
                        <div id="reward-image-container" class="relative w-48 h-48 mx-auto rounded-3xl p-2 bg-gradient-to-b from-white/20 to-white/5 border border-white/30 shadow-2xl flex items-center justify-center overflow-hidden">
                            <!-- Image will be injected via JS -->
                        </div>
                    </div>

                    <div>
                        <div class="inline-block bg-pink-500/20 text-pink-300 text-xs font-bold px-3.5 py-1.5 rounded-full mb-3 border border-pink-500/30">
                            🎉 Ура! Подарок ваш!
                        </div>
                        <h2 id="reward-title" class="text-2xl font-extrabold text-white mb-3">
                            Поздравляем!
                        </h2>
                        <p id="reward-desc" class="text-pink-100/90 text-sm leading-relaxed bg-slate-900/70 p-4 rounded-2xl border border-white/10 shadow-inner">
                            <!-- Reward description will be injected via JS -->
                        </p>
                    </div>

                    <button 
                        onclick="resetForm()" 
                        class="text-xs text-pink-300/80 hover:text-white underline transition-colors pt-2"
                    >
                        Ввести другой промокод
                    </button>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-pink-300/60 relative z-10">
        <p>© 2026 happybirthdaytati26. Специально для Тати! 🌸</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const rewards = {
            'якрасоткауменядр1еее': {
                title: 'Поздравляем!',
                desc: 'Ты выиграла легендарный фен Dyson Supersonic. Уже упаковываем и высылаем! Приедет примерно через 5 дней. Жди свой роскошный подарок! 🎁',
                image: '<img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?q=80&w=1000&auto=format&fit=crop" alt="Dyson Supersonic" class="w-full h-full object-cover rounded-2xl shadow-lg" onerror="this.onerror=null; this.src=\'https://placehold.co/400x400/1e1b4b/f43f5e?text=Dyson\';">'
            },
            'якрасоткауменядр2еее': {
                title: 'Поздравляем!',
                desc: 'Ты выиграла супер-эргономичное кресло для идеальной работы и отдыха. Уже отправляем курьером! Приедет примерно через 5 дней. Наслаждайся комфортом! 🪑✨',
                image: '<img src="https://images.unsplash.com/photo-1580481077494-e3299ac25e94?q=80&w=1000&auto=format&fit=crop" alt="Ergonomic Chair" class="w-full h-full object-cover rounded-2xl shadow-lg" onerror="this.onerror=null; this.src=\'https://placehold.co/400x400/1e1b4b/f43f5e?text=Chair\';">'
            },
            'якрасоткауменядр3еее': {
                title: 'Поздравляем!',
                desc: 'Ты выиграла абсолютно новый белый iPhone 17. Уже высылаем его тебе! Приедет примерно через 5 дней. Жди свой первый айфончик! 📱💖',
                image: '<img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=1000&auto=format&fit=crop" alt="White iPhone 17" class="w-full h-full object-cover rounded-2xl shadow-lg" onerror="this.onerror=null; this.src=\'https://placehold.co/400x400/1e1b4b/f43f5e?text=iPhone+17\';">'
            }
        };

        function handlePromoSubmit(event) {
            event.preventDefault();
            const inputVal = document.getElementById('promo-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (!rewards[inputVal]) {
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');

            // Populate reward details
            const reward = rewards[inputVal];
            document.getElementById('reward-title').textContent = reward.title;
            document.getElementById('reward-desc').textContent = reward.desc;
            document.getElementById('reward-image-container').innerHTML = reward.image;

            // Trigger celebratory confetti
            triggerConfetti();

            // Transition sections
            const promoSection = document.getElementById('promo-section');
            const successSection = document.getElementById('success-section');

            promoSection.style.opacity = '0';
            setTimeout(() => {
                promoSection.classList.add('hidden');
                successSection.classList.remove('hidden');
                successSection.style.opacity = '0';
                
                setTimeout(() => {
                    successSection.style.transition = 'opacity 0.6s ease-in-out';
                    successSection.style.opacity = '1';
                }, 50);
            }, 300);
        }

        function triggerConfetti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 35, spread: 360, ticks: 70, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 60 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#f43f5e', '#ec4899', '#fbbf24', '#a855f7', '#ffffff']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#f43f5e', '#fb7185', '#fbbf24', '#ec4899', '#ffffff']
                }));
            }, 250);
        }

        function resetForm() {
            const promoSection = document.getElementById('promo-section');
            const successSection = document.getElementById('success-section');
            const promoInput = document.getElementById('promo-input');

            promoInput.value = '';
            successSection.classList.add('hidden');
            promoSection.classList.remove('hidden');
            promoSection.style.opacity = '1';
        }
    </script>
</body>
</html>
